name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Create Android Project Files
        run: flutter create --project-name imo_clone_app .
      - name: Get Dependencies
        run: flutter pub get
      - name: Force Fix Android Gradle Settings
        run: |
          python3 -c '
          import glob, re
          for path in glob.glob("android/app/build.gradle*"):
              with open(path, "r") as f:
                  s = f.read()
              s = re.sub(r"minSdk\s*=?\s*flutter\.minSdkVersion", "minSdk = 24" if path.endswith(".kts") else "minSdkVersion 24", s)
              s = re.sub(r"compileSdk\s*=?\s*flutter\.compileSdkVersion", "compileSdk = 35" if path.endswith(".kts") else "compileSdkVersion 35", s)
              s = re.sub(r"targetSdk\s*=?\s*flutter\.targetSdkVersion", "targetSdk = 35" if path.endswith(".kts") else "targetSdkVersion 35", s)
              with open(path, "w") as f:
                  f.write(s)
              print("Updated:", path)
          '
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
      - name: Build Debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imo-clone-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
