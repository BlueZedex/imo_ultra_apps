name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Create Android Project Files
        run: flutter create --project-name imo_clone_app .
      - name: Get Dependencies
        run: flutter pub get
      - name: Fix Android SDK 35 & JCenter
        run: |
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle*
          sed -i 's/flutter.compileSdkVersion/35/g' android/app/build.gradle*
          sed -i 's/flutter.targetSdkVersion/35/g' android/app/build.gradle*
      - name: Build Debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imo-clone-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
